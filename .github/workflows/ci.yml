name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係のインストール
        run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
